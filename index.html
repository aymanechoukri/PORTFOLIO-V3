<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

                    <a href="#projects"

                    <a href="#contact"

                <ul class="flex flex-col gap-6 mt-12">

                    </li>

                hover:text-rose-500 active:scale-95 lg:hidden">

    <section>

        <article class="flex flex-col gap-6 justify-end h-[88vh] ml-[200px] w-[60%] clac-animation">

                        transition-all duration-300

                        hover:-translate-y-1 hover:border-rose-500 hover:bg-rose-950/30

            <div class="flex items-center gap-4">

                    target="_blank"
                    rel="noopener noreferrer"

                    class="text-2xl text-white hover:text-[#E5092A] transition-all duration-300 hover:scale-110"
                >
                    <i class="fa-brands fa-github"></i>
                </a>

                <a
                    href="https://www.linkedin.com/in/aymane-chokri-8750a6321/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="LinkedIn"
                    class="text-2xl text-white hover:text-[#E5092A] transition-all duration-300 hover:scale-110"
                >
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </div>

        <article class="flex items-end">
            <div class="z-[999] intro-left">
                <img src="./public/image/me.png" loading="lazy" alt="me" class="w-[1300px]">

            <div class="absolute right-[400px] intro-right">
                <img src="./public/image/robo.png" loading="lazy" alt="robo" class="w-[800px]">
