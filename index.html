<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>  
    <script src="src/script.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <title>PORTFOLIO | CHOKRI AYMANE</title>
</head>
<body>
    <header class="flex justify-between px-[20px] items-center py-[5px]">
        <a href="#profile"><img src="./public/image/Logo.png" alt="logo" class="w-[150px]"></a>
        <nav class="flex justify-center items-center">
            <ul class="flex items-center gap-3">
                <li>
                    <a href="#profile"
                    class="group relative px-5 py-3 text-sm font-semibold tracking-wider text-gray-300 transition-all duration-300 hover:text-white">
                        PROFILE
                        <span class="absolute bottom-0 left-1/2 h-[2px] w-0 -translate-x-1/2 bg-rose-600 transition-all duration-300 group-hover:w-full"></span>
                    </a>
                </li>

                <li>
                    <a href="#projects"
                    class="group relative px-5 py-3 text-sm font-semibold tracking-wider text-gray-300 transition-all duration-300 hover:text-white">
                        PROJECTS
                        <span class="absolute bottom-0 left-1/2 h-[2px] w-0 -translate-x-1/2 bg-rose-600 transition-all duration-300 group-hover:w-full"></span>
                    </a>
                </li>

                <li>
                    <a href="#about"
                    class="group relative px-5 py-3 text-sm font-semibold tracking-wider text-gray-300 transition-all duration-300 hover:text-white">
                        ABOUT
                        <span class="absolute bottom-0 left-1/2 h-[2px] w-0 -translate-x-1/2 bg-rose-600 transition-all duration-300 group-hover:w-full"></span>
                    </a>
                </li>

                <li>
                    <a href="#contact"
                    class="group relative px-5 py-3 text-sm font-semibold tracking-wider text-gray-300 transition-all duration-300 hover:text-white">
                        CONTACT
                        <span class="absolute bottom-0 left-1/2 h-[2px] w-0 -translate-x-1/2 bg-rose-600 transition-all duration-300 group-hover:w-full"></span>
                    </a>
                </li>
            </ul>
        </nav>

        <a href="./public/image/Aymane_Chokri_CV (1).pdf.pdf" download
            class="inline-flex items-center gap-3 px-6 py-3
                    rounded-xl border border-rose-700
                    bg-gradient-to-r from-rose-950 to-black
                    text-white font-semibold tracking-wider
                    shadow-lg shadow-rose-950/30
                    transition-all duration-300
                    hover:border-rose-500 hover:shadow-rose-900/50
                    hover:-translate-y-1 active:scale-95">

                <i class="fa-solid fa-file-arrow-down text-rose-500 text-lg"></i>
                DOWNLOAD CV
        </a>
    </header>
</body>
</html>
